services:
  api:
    build: .
    container_name: ml-api
    ports:
      - "5001:5001"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 3s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.8.1
    container_name: ml-mlflow
    ports:
      # Host 5002 → container 5000. A 5000 do host é usada pelo AirPlay no macOS Sonoma+.
      # A comunicação interna (api → mlflow:5000) NÃO passa pelo host, então segue na 5000.
      - "5002:5000"
    command: mlflow server --host 0.0.0.0 --port 5000
    volumes:
      - ./mlruns:/mlruns
    restart: unless-stopped
